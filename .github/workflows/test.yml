name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            migrator/go.sum
            backend/go.sum
      - name: migrator
        working-directory: migrator
        run: go test -race -cover ./...
      - name: backend
        working-directory: backend
        run: go test -race -cover ./...

  frontend-unit:
    name: Frontend unit (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - working-directory: frontend
        run: pnpm test

  e2e:
    name: Playwright E2E (against prod)
    runs-on: ubuntu-latest
    needs: [go-unit, frontend-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/package.json
      - working-directory: e2e
        run: npm install --no-audit --no-fund
      - working-directory: e2e
        run: npx playwright install --with-deps chromium
      - working-directory: e2e
        run: npx playwright test
        env:
          TEST_BASE_URL: ${{ vars.TEST_BASE_URL || 'https://migrator.170.84.141.15.sslip.io' }}
          E2E_SUPER_EMAIL: ${{ secrets.E2E_SUPER_EMAIL || vars.E2E_SUPER_EMAIL }}
          E2E_SUPER_PASSWORD: ${{ secrets.E2E_SUPER_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
